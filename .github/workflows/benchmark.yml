name: Benchmark

env:
  version: 10.0.2

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      filter:
        description: "pytest -k expression (empty runs all benchmarks)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  start:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/benchmark') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      comment_id: ${{ steps.post.outputs.comment_id }}
    steps:
      - name: Post status comment
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=":hourglass_flowing_sand: Benchmark started: building base and PR. Next update at $(date -u -d '+5 min' +%H:%M) UTC. [Live run]($RUN_URL)"
          id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -f body="$body" --jq .id)
          echo "comment_id=$id" >> "$GITHUB_OUTPUT"

  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/benchmark') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.refs.outputs.head }}
      base: ${{ steps.refs.outputs.base }}
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Resolve refs and filter
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ github.event.comment.body }}
          INPUT_FILTER: ${{ inputs.filter }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            pr=${{ github.event.issue.number }}
            head=$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq .head.sha)
            base=$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq .base.sha)
            filter=$(printf '%s\n' "$COMMENT" | head -n1 | sed -E 's|^/benchmark[[:space:]]*||')
          else
            head=${{ github.sha }}
            base=$(gh api "repos/${{ github.repository }}/commits/master" --jq .sha)
            filter=$INPUT_FILTER
          fi
          if [[ ! "$filter" =~ ^[A-Za-z0-9_\ ]*$ ]]; then
            echo "::error::Invalid filter: only letters, digits, '_' and spaces are allowed"
            exit 1
          fi
          {
            echo "head=$head"
            echo "base=$base"
            echo "filter=$filter"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.head }}
          path: pr
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.base }}
          path: base
          persist-credentials: false

      - name: Install SCIPOptSuite
        run: |
          wget --quiet --no-check-certificate "https://github.com/scipopt/scip/releases/download/v${version}/scipoptsuite_${version}-1+jammy_amd64.deb"
          sudo apt-get update && sudo apt install -y ./scipoptsuite_${version}-1+jammy_amd64.deb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheels
        run: |
          for side in base pr; do
            python -m pip wheel --no-deps -w "wheels/$side" "./$side"
          done

      - name: List benchmarks
        id: list
        env:
          FILTER: ${{ steps.refs.outputs.filter }}
        run: |
          python -m venv venv
          venv/bin/pip install -q -r pr/requirements/benchmark.txt wheels/pr/*.whl
          select=()
          [ -n "$FILTER" ] && select=(-k "$FILTER")
          cd pr
          for tier in "not timing" "timing"; do
            { ../venv/bin/python -m pytest benchmarks --collect-only -q -m "$tier" "${select[@]}" | grep '::' || true; } \
              | sed "s/\$/\t$tier/"
          done > ../benchmarks.tsv
          cd ..
          matrix=$(python -c '
          import json
          rows = [line.rstrip("\n").split("\t") for line in open("benchmarks.tsv") if line.strip()]
          print(json.dumps([{"id": i, "name": i.split("::")[-1], "timing": t == "timing"} for i, t in rows]))
          ')
          if [ "$matrix" = "[]" ]; then
            echo "::error::No benchmark matches the filter"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheels/

  bench:
    needs: prepare
    name: "bench: ${{ matrix.name }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
          path: pr
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels

      - name: Install SCIPOptSuite and Valgrind
        run: |
          wget --quiet --no-check-certificate "https://github.com/scipopt/scip/releases/download/v${version}/scipoptsuite_${version}-1+jammy_amd64.deb"
          sudo apt-get update && sudo apt install -y ./scipoptsuite_${version}-1+jammy_amd64.deb valgrind

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install base and PR
        run: |
          for side in base pr; do
            python -m venv "venv-$side"
            "venv-$side/bin/pip" install -q -r pr/requirements/benchmark.txt "wheels/$side"/*.whl
          done
          cc -O2 -shared -fPIC -o callgrind.so pr/benchmarks/callgrind.c

      - name: Measure
        env:
          BENCH_ID: ${{ matrix.id }}
          TIMING: ${{ matrix.timing }}
          INDEX: ${{ strategy.job-index }}
          BENCH_CALLGRIND_LIB: ${{ github.workspace }}/callgrind.so
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p results
          cd pr
          run() {
            local side=$1 mode=$2
            shift 2
            BENCH_MODE=$mode BENCH_LABEL="$mode/$side" BENCH_OUT="../results/$side-$INDEX.jsonl" \
              "$@" "../venv-$side/bin/python" -m pytest "$BENCH_ID" -q -p no:cacheprovider
          }
          for side in base pr; do
            run "$side" memory
          done
          if [ "$TIMING" = "true" ]; then
            for side in base pr; do
              run "$side" time
            done
          else
            for side in base pr; do
              mkdir -p "../callgrind-$side"
              BENCH_CALLGRIND_OUT="../callgrind-$side/out" run "$side" instructions \
                setarch -R valgrind -q --tool=callgrind --instr-atstart=no --callgrind-out-file="../callgrind-$side/out"
            done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ strategy.job-index }}
          path: results/

  progress:
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Update status comment every 5 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMENT_ID: ${{ needs.start.outputs.comment_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import json, os, subprocess, time
          from datetime import datetime, timedelta, timezone

          INTERVAL = 300
          repo, run_id, comment_id, run_url = (os.environ[k] for k in ("REPO", "RUN_ID", "COMMENT_ID", "RUN_URL"))

          def gh(*args):
              return subprocess.run(["gh", "api", *args], check=True, capture_output=True, text=True).stdout

          def parse(ts):
              return datetime.fromisoformat(ts.replace("Z", "+00:00"))

          def minutes(seconds):
              return f"{max(1, round(seconds / 60))} min"

          def status():
              out = gh("--paginate", f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100", "--jq", ".jobs[]")
              jobs = [json.loads(line) for line in out.splitlines()]
              prepare = next((j for j in jobs if j["name"] == "prepare"), None)
              bench = [j for j in jobs if j["name"].startswith("bench: ")]
              return prepare, bench

          def eta(bench, now):
              finished = [
                  (parse(j["completed_at"]) - parse(j["started_at"])).total_seconds()
                  for j in bench if j["status"] == "completed"
              ]
              if not finished:
                  return None
              typical = sum(finished) / len(finished)
              running = [(now - parse(j["started_at"])).total_seconds() for j in bench if j["status"] == "in_progress"]
              queued = any(j["status"] in ("queued", "waiting", "pending") for j in bench)
              return max([typical - r for r in running] + [0]) + (typical if queued else 0)

          start = datetime.now(timezone.utc)
          while True:
              time.sleep(INTERVAL)
              prepare, bench = status()
              if prepare and prepare["status"] == "completed" and prepare["conclusion"] != "success":
                  break
              if bench and all(j["status"] == "completed" for j in bench):
                  break
              now = datetime.now(timezone.utc)
              next_update = now + timedelta(seconds=INTERVAL)
              if not bench:
                  text = "building base and PR"
              else:
                  done = sum(j["status"] == "completed" for j in bench)
                  text = f"{done}/{len(bench)} benchmarks done"
                  remaining = eta(bench, now)
                  if remaining is not None:
                      text += f", about {minutes(remaining)} left"
              body = (
                  f":hourglass_flowing_sand: Benchmark running for {minutes((now - start).total_seconds())}: {text}. "
                  f"Next update at {next_update:%H:%M} UTC. [Live run]({run_url})"
              )
              gh("-X", "PATCH", f"repos/{repo}/issues/comments/{comment_id}", "-f", f"body={body}")

  report:
    needs: [prepare, bench]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
          path: pr
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compare
        env:
          BENCH_RESULT: ${{ needs.bench.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            python pr/benchmarks/compare.py --base results/base-*.jsonl --pr results/pr-*.jsonl
            echo
            if [ "$BENCH_RESULT" != "success" ]; then
              echo ":warning: Some benchmark jobs did not succeed; their rows are missing or incomplete."
              echo
            fi
            echo "Base \`${{ needs.prepare.outputs.base }}\`, PR \`${{ needs.prepare.outputs.head }}\`. [Run]($RUN_URL)"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: comment
          path: comment.md

  comment:
    needs: [start, prepare, bench, report]
    if: always() && needs.start.outputs.comment_id != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        if: needs.report.result == 'success'
        with:
          name: comment

      - name: Post results and close status comment
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.report.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then
            url=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -F body=@comment.md --jq .html_url)
            status=":white_check_mark: Benchmark finished. [Results]($url)"
          else
            status=":x: Benchmark did not finish. See the [run]($RUN_URL)."
          fi
          gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${{ needs.start.outputs.comment_id }}" -f body="$status"
