name: Benchmark

env:
  version: 10.0.2

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      filter:
        description: "pytest -k expression (empty runs all benchmarks)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  start:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/benchmark') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    outputs:
      comment_id: ${{ steps.post.outputs.comment_id }}
      request: ${{ steps.post.outputs.request }}
    steps:
      - name: Acknowledge and post status comment
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          REQUESTER: ${{ github.event.comment.user.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes > /dev/null
          command=$(printf '%s\n' "$COMMENT" | head -n1 | tr -cd 'A-Za-z0-9_/ ' | cut -c1-80)
          request="[\`$command\`]($COMMENT_URL) (requested by @$REQUESTER)"
          body=":hourglass_flowing_sand: $request: installing SCIP and building wheels. Next update at $(date -u -d '+5 min' +%H:%M) UTC. [Live run]($RUN_URL)"
          id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -f body="$body" --jq .id)
          {
            echo "comment_id=$id"
            echo "request=$request"
          } >> "$GITHUB_OUTPUT"

  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/benchmark') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.refs.outputs.head }}
      base: ${{ steps.refs.outputs.base }}
      filter: ${{ steps.refs.outputs.filter }}
      release: ${{ steps.refs.outputs.release }}
    steps:
      - name: Resolve refs and filter
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ github.event.comment.body }}
          INPUT_FILTER: ${{ inputs.filter }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            pr=${{ github.event.issue.number }}
            head=$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq .head.sha)
            base=$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq .base.sha)
            filter=$(printf '%s\n' "$COMMENT" | head -n1 | sed -E 's|^/benchmark[[:space:]]*||')
          else
            head=${{ github.sha }}
            base=$(gh api "repos/${{ github.repository }}/commits/master" --jq .sha)
            filter=$INPUT_FILTER
          fi
          if [[ ! "$filter" =~ ^[A-Za-z0-9_\ ]*$ ]]; then
            echo "::error::Invalid filter: only letters, digits, '_' and spaces are allowed"
            exit 1
          fi
          release=$(gh api repos/scipopt/PySCIPOpt/releases/latest --jq .tag_name)
          {
            echo "head=$head"
            echo "base=$base"
            echo "filter=$filter"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: "build: ${{ matrix.side }}"
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        side: [base, pr, release]
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Pick source
        id: source
        env:
          SIDE: ${{ matrix.side }}
          HEAD: ${{ needs.prepare.outputs.head }}
          BASE: ${{ needs.prepare.outputs.base }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          case "$SIDE" in
            pr) echo "repository=${{ github.repository }}" >> "$GITHUB_OUTPUT"; echo "ref=$HEAD" >> "$GITHUB_OUTPUT" ;;
            base) echo "repository=${{ github.repository }}" >> "$GITHUB_OUTPUT"; echo "ref=$BASE" >> "$GITHUB_OUTPUT" ;;
            release) echo "repository=scipopt/PySCIPOpt" >> "$GITHUB_OUTPUT"; echo "ref=$RELEASE" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/cache@v4
        id: cache
        if: matrix.side != 'pr'
        with:
          path: wheels/${{ matrix.side }}
          key: wheel-${{ steps.source.outputs.ref }}-scip${{ env.version }}-py3.13

      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          path: src
          persist-credentials: false

      - name: Install SCIPOptSuite
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          wget --quiet --no-check-certificate "https://github.com/scipopt/scip/releases/download/v${version}/scipoptsuite_${version}-1+jammy_amd64.deb"
          sudo apt-get update && sudo apt install -y ./scipoptsuite_${version}-1+jammy_amd64.deb

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.13"

      - name: Build wheel
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m pip wheel --no-deps -w "wheels/${{ matrix.side }}" ./src

      - name: List benchmarks
        id: list
        if: matrix.side == 'pr'
        env:
          FILTER: ${{ needs.prepare.outputs.filter }}
        run: |
          python -m venv venv
          venv/bin/pip install -q -r src/requirements/benchmark.txt wheels/pr/*.whl
          select=()
          [ -n "$FILTER" ] && select=(-k "$FILTER")
          cd src
          for tier in "not timing" "timing"; do
            { ../venv/bin/python -m pytest benchmarks --collect-only -q -m "$tier" "${select[@]}" | grep '::' || true; } \
              | sed "s/\$/\t$tier/"
          done > ../benchmarks.tsv
          cd ..
          matrix=$(python -c '
          import json
          rows = [line.rstrip("\n").split("\t") for line in open("benchmarks.tsv") if line.strip()]
          print(json.dumps([{"id": i, "name": i.split("::")[-1], "timing": t == "timing"} for i, t in rows]))
          ')
          if [ "$matrix" = "[]" ]; then
            echo "::error::No benchmark matches the filter"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.side }}
          path: wheels/

  bench:
    needs: [prepare, build]
    name: "bench: ${{ matrix.name }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head }}
          path: pr
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true

      - name: Install SCIPOptSuite and Valgrind
        run: |
          wget --quiet --no-check-certificate "https://github.com/scipopt/scip/releases/download/v${version}/scipoptsuite_${version}-1+jammy_amd64.deb"
          sudo apt-get update && sudo apt install -y ./scipoptsuite_${version}-1+jammy_amd64.deb valgrind

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install base and PR
        run: |
          for side in base pr release; do
            python -m venv "venv-$side"
            "venv-$side/bin/pip" install -q -r pr/requirements/benchmark.txt "wheels/$side"/*.whl
          done
          cc -O2 -shared -fPIC -o callgrind.so pr/benchmarks/callgrind.c

      - name: Result cache key
        id: key
        run: |
          deps=$(venv-pr/bin/pip freeze | grep -iv '^pyscipopt' | sha256sum | cut -c1-16)
          echo "env=$ImageOS-$ImageVersion-scip$version-$deps" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: cached/base
          key: results-${{ needs.prepare.outputs.base }}-${{ steps.key.outputs.env }}-${{ hashFiles('pr/benchmarks/**') }}-${{ matrix.id }}

      - uses: actions/cache@v4
        with:
          path: cached/release
          key: results-${{ needs.prepare.outputs.release }}-${{ steps.key.outputs.env }}-${{ hashFiles('pr/benchmarks/**') }}-${{ matrix.id }}

      - name: Measure
        env:
          BENCH_ID: ${{ matrix.id }}
          TIMING: ${{ matrix.timing }}
          INDEX: ${{ strategy.job-index }}
          BENCH_CALLGRIND_LIB: ${{ github.workspace }}/callgrind.so
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p results
          cd pr
          run() {
            local side=$1 mode=$2 out=$3
            shift 3
            BENCH_MODE=$mode BENCH_LABEL="$mode/$side" BENCH_OUT="$out" \
              "$@" "../venv-$side/bin/python" -m pytest "$BENCH_ID" -q -p no:cacheprovider
          }
          deterministic() {
            local side=$1 out=$2
            run "$side" memory "$out" || return 1
            if [ "$TIMING" != "true" ]; then
              mkdir -p "../callgrind-$side"
              BENCH_CALLGRIND_OUT="../callgrind-$side/out" run "$side" instructions "$out" \
                setarch -R valgrind -q --tool=callgrind --instr-atstart=no --callgrind-out-file="../callgrind-$side/out" || return 1
            fi
          }
          release_ok=true
          for side in base release; do
            cached="../cached/$side/results.jsonl"
            if [ -s "$cached" ]; then
              echo "Using cached $side results"
            elif deterministic "$side" "../$side.tmp"; then
              mkdir -p "../cached/$side"
              mv "../$side.tmp" "$cached"
            elif [ "$side" = release ]; then
              echo "::warning::$BENCH_ID does not run on the latest release; skipping it there"
              release_ok=false
              continue
            else
              exit 1
            fi
            cat "$cached" >> "../results/$side-$INDEX.jsonl"
          done
          deterministic pr "../results/pr-$INDEX.jsonl"
          if [ "$TIMING" = "true" ]; then
            run base time "../results/base-$INDEX.jsonl"
            run pr time "../results/pr-$INDEX.jsonl"
            if [ "$release_ok" = true ]; then
              run release time "../results/release-$INDEX.jsonl"
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ strategy.job-index }}
          path: results/

  progress:
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Update status comment every 5 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMENT_ID: ${{ needs.start.outputs.comment_id }}
          REQUEST: ${{ needs.start.outputs.request }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import json, os, subprocess, time
          from datetime import datetime, timedelta, timezone

          INTERVAL = 300
          repo, run_id, comment_id, run_url, request = (
              os.environ[k] for k in ("REPO", "RUN_ID", "COMMENT_ID", "RUN_URL", "REQUEST")
          )

          def gh(*args):
              return subprocess.run(["gh", "api", *args], check=True, capture_output=True, text=True).stdout

          def parse(ts):
              return datetime.fromisoformat(ts.replace("Z", "+00:00"))

          def minutes(seconds):
              return f"{max(1, round(seconds / 60))} min"

          def status():
              out = gh("--paginate", f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100", "--jq", ".jobs[]")
              jobs = [json.loads(line) for line in out.splitlines()]
              setup = [j for j in jobs if j["name"] == "prepare" or j["name"].startswith("build: ")]
              bench = [j for j in jobs if j["name"].startswith("bench: ")]
              return setup, bench

          def current_step(job):
              if job["status"] == "completed":
                  return "done"
              if job["status"] != "in_progress":
                  return "waiting for a runner"
              steps = [s for s in job.get("steps", []) if s["status"] == "in_progress"]
              return f"at '{steps[0]['name']}'" if steps else "starting"

          def setup_text(setup):
              builds = [j for j in setup if j["name"].startswith("build: ")]
              if not builds:
                  return "resolving commits"
              parts = [f"{j['name'].removeprefix('build: ')} {current_step(j)}" for j in builds]
              return "installing SCIP and building wheels (" + ", ".join(parts) + "; usually 5–10 min)"

          def durations(jobs):
              return {
                  j["name"]: (parse(j["completed_at"]) - parse(j["started_at"])).total_seconds()
                  for j in jobs
                  if j["name"].startswith("bench: ") and j["conclusion"] == "success"
              }

          def previous_durations():
              runs = json.loads(gh(f"repos/{repo}/actions/runs/{run_id}", "--jq", "{workflow_id}"))
              out = gh(
                  f"repos/{repo}/actions/workflows/{runs['workflow_id']}/runs?status=success&per_page=5",
                  "--jq", ".workflow_runs[].id",
              )
              for previous in out.split():
                  jobs = gh("--paginate", f"repos/{repo}/actions/runs/{previous}/jobs?per_page=100", "--jq", ".jobs[]")
                  known = durations(json.loads(line) for line in jobs.splitlines())
                  if known:
                      return known
              return {}

          def eta(bench, now, expected):
              expected = {**expected, **durations(bench)}
              if not expected:
                  return None
              slowest = max(expected.values())
              left = []
              for j in bench:
                  if j["status"] == "completed":
                      continue
                  total = expected.get(j["name"], slowest)
                  if j["status"] == "in_progress":
                      left.append(total - (now - parse(j["started_at"])).total_seconds())
                  else:
                      left.append(total)
              return max(left, default=0)

          start = datetime.now(timezone.utc)
          expected = previous_durations()
          while True:
              time.sleep(INTERVAL)
              setup, bench = status()
              if any(j["status"] == "completed" and j["conclusion"] != "success" for j in setup):
                  break
              if bench and all(j["status"] == "completed" for j in bench):
                  break
              now = datetime.now(timezone.utc)
              next_update = now + timedelta(seconds=INTERVAL)
              if not bench:
                  text = setup_text(setup)
              else:
                  done = sum(j["status"] == "completed" for j in bench)
                  running = sum(j["status"] == "in_progress" for j in bench)
                  text = f"{done}/{len(bench)} benchmarks done, {running} running"
                  remaining = eta(bench, now, expected)
                  if remaining is None:
                      pass
                  elif remaining > 30:
                      text += f", about {minutes(remaining)} left"
                  else:
                      text += ", finishing up"
              body = (
                  f":hourglass_flowing_sand: {request}: running for {minutes((now - start).total_seconds())}, {text}. "
                  f"Next update at {next_update:%H:%M} UTC. [Live run]({run_url})"
              )
              gh("-X", "PATCH", f"repos/{repo}/issues/comments/{comment_id}", "-f", f"body={body}")

  report:
    needs: [prepare, build, bench]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tools
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compare
        env:
          BENCH_RESULT: ${{ needs.bench.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            python tools/benchmarks/compare.py --base results/base-*.jsonl --pr results/pr-*.jsonl
            echo
            if compgen -G "results/release-*.jsonl" > /dev/null; then
              echo "<details><summary>Compared with the latest release (${{ needs.prepare.outputs.release }})</summary>"
              echo
              python tools/benchmarks/compare.py --title "Latest release (${{ needs.prepare.outputs.release }}) → PR" \
                --base results/release-*.jsonl --pr results/pr-*.jsonl
              echo
              echo "</details>"
              echo
            fi
            if [ "$BENCH_RESULT" != "success" ]; then
              echo ":warning: Some benchmark jobs did not succeed; their rows are missing or incomplete."
              echo
            fi
            echo "Base \`${{ needs.prepare.outputs.base }}\`, PR \`${{ needs.prepare.outputs.head }}\`. [Run]($RUN_URL)"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: comment
          path: comment.md

  comment:
    needs: [start, prepare, build, bench, report]
    if: always() && needs.start.outputs.comment_id != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        if: needs.report.result == 'success'
        with:
          name: comment

      - name: Post results and close status comment
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.report.result }}
          REQUEST: ${{ needs.start.outputs.request }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = "success" ]; then
            { echo "Results for $REQUEST."; echo; cat comment.md; } > body.md
            url=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" -F body=@body.md --jq .html_url)
            status=":white_check_mark: $REQUEST: finished. [Results]($url)"
          else
            status=":x: $REQUEST: did not finish. See the [run]($RUN_URL)."
          fi
          gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${{ needs.start.outputs.comment_id }}" -f body="$status"
